    <h1>用 PCA 当导航读《机器学习的矩阵方法》</h1>
    
<p>个人分享 · 矩阵方法跟读。</p>
<p>把 PCA 当成全书导航，而不是孤章算法：</p>
<ul>
  <li>向量空间 / 基与秩 → 你在什么空间里投影</li>
  <li>内积与投影 → 方差、正交分解的语言</li>
  <li>矩阵分解 → 特征分解只是入口</li>
  <li>微分 / 概率 / 优化 → 目标函数怎么推、怎么推广</li>
</ul>
<p>后面章节可以问自己：它在为 PCA 的哪一块补语言？</p>
